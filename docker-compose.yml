services:
    backend:
        build: 
            context: ./backend
            dockerfile: Dockerfile
        ports:
            - "3000:3000"
        networks:
            - app-networks
    
    frontend:
        build: 
            context: ./frontend
            dockerfile: Dockerfile
        ports:
            - "5173:5173"
        networks:
            - app-networks

networks:
    app-networks:
        driver: bridge